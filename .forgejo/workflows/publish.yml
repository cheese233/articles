on:
  push:
    branches:
      - "main"

env:
  GIT_DEFAULT_HASH: sha256

jobs:
  publish:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - uses: https://github.com/denoland/setup-deno@v2
        with:
          deno-version: ^2

      - name: Generate
        run: deno task build --backend git # you should have git if there's an actions/checkout
        env:
          DOC_ROOT: "https://c23.me"
          SITE_TITLE: "cheese233's blog"

      - name: Deploy website
        uses: actions/git-pages@v2
        with:
          site: https://c23.me/
          server: grebedoc.dev
          source: .
          password: ${{ secrets.GIT_PAGES_PASSWORD }}
