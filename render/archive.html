<template id="article">
    <fluent-card
        style="
            width: 300px;
            height: fit-content;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        "
    >
        <img
            src="https://placehold.co/300x150"
            alt="Placeholder"
            style="border-radius: 4px; width: 100%"
        />

        <div>
            <h3
                style="
                    margin: 0;
                    font-family: var(--body-font);
                    color: var(--neutral-foreground-rest);
                "
            >
                title
            </h3>
            <p style="font-size: 12px; color: var(--neutral-foreground-hint)">
                description
            </p>
        </div>

        <div style="display: flex; gap: 8px; justify-content: flex-end">
            <fluent-button appearance="outline">Cancel</fluent-button>
            <fluent-button appearance="accent">OK</fluent-button>
        </div>
    </fluent-card>
</template>
