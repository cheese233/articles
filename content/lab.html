<meta name="title" content="HTML 实验室" />
<meta
    name="description"
    content="一个由 html.ext.js 处理、并在浏览器里执行模块脚本的 HTML 页面。"
/>
<meta name="date" content="2026-10-21" />
<meta name="tags" content="demo, html" />

<h1>HTML 实验室</h1>
<p>
    这个页面是 <code>content/lab.html</code>。它没有 frontmatter，元信息写在
    <code>&lt;meta&gt;</code> 标签里，由 <code>html.ext.js</code> 解析。
</p>
<p>
    那个按钮的点击逻辑来自页面里的
    <code>&lt;script type="module"&gt;</code>。脚本必须
    <code>export default</code> 一个函数，参数是 ShadowRoot——和
    <code>.js</code> 文章使用同一个约定。
</p>
<p>
    <button type="button" id="lab-button">点我</button>
    <span id="lab-output">还没有点过。</span>
</p>

<script type="module">
    export default function (shadow) {
        const button = shadow.querySelector("#lab-button");
        const output = shadow.querySelector("#lab-output");
        let count = 0;

        if (button && output) {
            button.addEventListener("click", () => {
                count += 1;
                output.textContent = `你点了 ${count} 次。`;
            });
        }
    }
</script>
