name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 \
            libpango-1.0-0

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chrome Headless Shell
        run: |
          npx -y @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/chrome"
          echo "CHROME_PATH=$(find "$RUNNER_TEMP/chrome" -type f -name chrome-headless-shell | head -n 1)" >> "$GITHUB_ENV"

      - name: Test
        run: npm test
